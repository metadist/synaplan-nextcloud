name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Synaplan the app is tested against; scripts/synaplan-openapi.sh reads
  # it from here and Renovate bumps it (renovate.json5).
  SYNAPLAN_IMAGE_DIGEST: sha256:2d26f285cb9b62e1d59e4a469cc14142769273798688f9cd4dbbe6f3a4a4238f

jobs:
  php:
    name: PHP (Nextcloud ${{ matrix.nextcloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lower bound of info.xml runs on the app's PHP floor, the upper
          # bound on the PHP its server image ships.
          - nextcloud: 33
            php: '8.2'
          - nextcloud: 35
            php: '8.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Use the Nextcloud ${{ matrix.nextcloud }} API
        if: matrix.nextcloud != 33
        run: |
          composer config platform.php ${{ matrix.php }}
          composer require --dev --no-interaction --no-progress -W "nextcloud/ocp:dev-stable${{ matrix.nextcloud }}"

      - run: composer run lint
      - run: composer run stan
      - run: composer run test

  contract:
    name: Contract (pinned Synaplan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress
      - run: scripts/synaplan-openapi.sh
      - run: composer run test:contract

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:types
      - run: npm run test:unit
      - run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: make package

      - name: Check the tarball
        run: |
          tar -tzf synaplan_integration.tar.gz > contents.txt
          for path in appinfo/info.xml appinfo/routes.php lib/AppInfo/Application.php js/ templates/; do
            grep -Fxq "synaplan_integration/$path" contents.txt || { echo "missing: $path"; exit 1; }
          done
          if grep -qE "^synaplan_integration/(tests|node_modules|vendor|src)/" contents.txt; then
            echo "development files in the tarball"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synaplan_integration-unsigned
          path: synaplan_integration.tar.gz
          retention-days: 7

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [php, contract, frontend, package]
    if: always()
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed or were cancelled"
          exit 1

      - name: All checks passed
        if: "!(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))"
        run: echo "All checks passed"

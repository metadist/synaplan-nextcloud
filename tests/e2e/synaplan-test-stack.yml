# Extra compose file for the Synaplan test stack, used with the synaplan
# repo's docker-compose.test.yml:
#
#   docker compose -f docker-compose.test.yml -f docker-compose.test.ci.yml \
#     -f <this repo>/tests/e2e/synaplan-test-stack.yml up -d --wait
#
# Synaplan keeps the one-time codes of "Connect your Synaplan account" in
# Redis, which the test stack does not start. Production always has Redis.

services:
    redis_test:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        networks:
            - synaplan-test-network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 3s
            retries: 15

    app_test:
        environment:
            REDIS_DSN: redis://redis_test:6379
            STRIPE_SECRET_KEY: ''
            CLOUD_FILES_ENABLED: 'true'
        depends_on:
            redis_test:
                condition: service_healthy
